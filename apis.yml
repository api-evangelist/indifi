aid: indifi
name: Indifi
description: 'Indifi Technologies Pvt. Ltd. is an Indian digital lending platform that provides
  collateral-free business loans to micro, small, and medium enterprises (MSMEs). Founded in
  Gurugram, Indifi originates and underwrites term loans, working-capital lines of credit,
  unsecured lines of credit, invoice discounting, and merchant cash advances (against POS
  transaction history), funding them through a network of 15+ RBI-regulated NBFCs and banks
  as well as its own NBFC, Indifi Capital Pvt. Ltd. (RBI Cert. No. B-14.03389). Loans range up
  to INR 50 lakhs with tenures up to 36 months and rates from 1.5% per month, assessed largely
  on business cash-flow, GST, and platform transaction data rather than traditional collateral.
  Indifi works through industry partnerships with e-commerce marketplaces and sector aggregators
  and through co-lending/DSA lending partners; it does not currently publish a public developer
  API or portal. Backed by Accel.'
